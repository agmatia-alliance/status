# Change these first
owner: agmatia-alliance # Your GitHub organization or username, where this repository lives
repo: status # The name of this repository

sites:
  - name: Main Website
    url: https://agmatia.org
  - name: GitHub Organization
    url: https://github.com/agmatia

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.agmatia.org
  # baseUrl: /your-repo-name
  logoUrl: https://agmatia.org/logos/nexus-symbol-light.svg
  faviconSvg: https://agmatia.org/logos/nexus-symbol-light.svg
  name: Agmatia Alliance Status
  themeUrl: https://status.agmatia.org/agmatia-theme.css
  metaTags:
    - name: color-scheme
      content: dark
    - name: theme-color
      content: "#000000"
  navbar:
    - title: Status
      href: /
    - title: Main Site
      href: https://agmatia.org
    - title: GitHub
      href: https://github.com/agmatia

